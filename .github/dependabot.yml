version: 2
multi-ecosystem-groups:
  weekly:
    schedule:
      interval: weekly
updates:
  - package-ecosystem: mix
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: weekly
  - package-ecosystem: npm
    directory: "/apps/wallop_web/assets"
    patterns: ["*"]
    multi-ecosystem-group: weekly
  - package-ecosystem: cargo
    directory: "/apps/wallop_core/native/drand_bls"
    patterns: ["*"]
    multi-ecosystem-group: weekly
  - package-ecosystem: github-actions
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: weekly
  - package-ecosystem: docker
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: weekly
